<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>MiaChat - 带记忆的 AI</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; display: flex; justify-content: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 600px; background: white; display: flex; flex-direction: column; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .header { background: #007bff; color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 10px 15px; border-radius: 10px; line-height: 1.5; }
        .user-message { align-self: flex-end; background: #007bff; color: white; border-bottom-right-radius: 0; }
        .ai-message { align-self: flex-start; background: #e4e6eb; color: black; border-bottom-left-radius: 0; }
        .memory-tag { font-size: 12px; color: #888; margin-top: 5px; font-style: italic; }
        .input-area { display: flex; padding: 15px; border-top: 1px solid #ddd; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        button { padding: 10px 20px; margin-left: 10px; background: #007bff; color: white; border: none; border-radius: 20px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">MiaChat (DeepSeek + Mem0)</div>
        <div class="chat-box" id="chatBox">
            <div class="message ai-message">你好！我是带有记忆功能的 AI，告诉我一些关于你的事情吧。</div>
        </div>
        <div class="input-area">
            <input type="text" id="msgInput" placeholder="输入消息..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const msgInput = document.getElementById('msgInput');
        const userId = "xiaoming"; // 固定测试用户

        async function sendMessage() {
            const text = msgInput.value.trim();
            if (!text) return;

            // 显示用户消息
            appendMessage(text, 'user-message');
            msgInput.value = '';

            // 显示加载中
            const loadingId = appendMessage('思考中...', 'ai-message');

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, message: text })
                });
                const data = await response.json();

                // 替换加载中为真实回复
                const aiMsgDiv = document.getElementById(loadingId);
                aiMsgDiv.innerText = data.reply;

                // 如果有命中记忆，附加显示在气泡下方
                if (data.used_memories && data.used_memories.length > 0) {
                    const memDiv = document.createElement('div');
                    memDiv.className = 'memory-tag';
                    memDiv.innerText = "💡 触发记忆：" + data.used_memories.join(" | ");
                    aiMsgDiv.appendChild(memDiv);
                }

            } catch (error) {
                document.getElementById(loadingId).innerText = '网络错误，请检查服务是否开启。';
            }
        }

        function appendMessage(text, className) {
            const div = document.createElement('div');
            const id = 'msg-' + Date.now();
            div.id = id;
            div.className = 'message ' + className;
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return id;
        }
    </script>
</body>
</html>
